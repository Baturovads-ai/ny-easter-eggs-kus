<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Новогодние пасхалки КУС</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<main class="wrap">
  <header class="head">
    <p class="eyebrow">КУС · Ипотека · покупатель</p>
    <h1>Новогодние пасхалки</h1>
    <p class="sub">Идеи запускаются сами, повторить можно кнопкой. Замёрзший экран можно протирать варежкой.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Идеи">
    <button role="tab" id="tab-G" data-scene="G" aria-selected="true">1 · Гирлянда</button>
    <button role="tab" id="tab-F" data-scene="F" aria-selected="false">2 · Замёрзший экран</button>
    <button role="tab" id="tab-S" data-scene="S" aria-selected="false">3 · Шаг и кнопка</button>
  </div>

  <section class="stage">
    <div class="phone-wrap" id="pw">
      <div class="phone" id="phone">
        <div class="layer" id="layer"></div>
        <div id="assets" hidden>
          <img data-n="g_off" src="assets/g_off.png?v=1" alt="Главная, поиск недвижимости, 2 из 6" width="360" height="800">
          <img data-n="frost" src="assets/frost.png?v=1" alt="Экран «Покупка недвижимости»" width="360" height="800">
          <img data-n="t1" src="assets/t1.png?v=1" alt="Шаг 1 из 11, кнопка «Перейти»" width="360" height="800">
          <img data-n="t3" src="assets/t3.png?v=1" alt="Шаг 1 выполнен" width="360" height="800">
          <img data-n="mitten" src="assets/mitten.png?v=2" alt="" width="80" height="80">
          <img data-n="t4" src="assets/t4.png?v=1" alt="Шаг 2 из 11" width="360" height="800">
        </div>
      </div>
    </div>

    <aside class="info" id="info" aria-live="polite"></aside>
  </section>
</main>
<script src="script.js?v=11"></script>
</body>
</html>
